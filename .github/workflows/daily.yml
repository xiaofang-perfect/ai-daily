name: Daily AI News

on:
  schedule:
    # 双触发兜底：GitHub schedule 经常延迟/丢失，跑两次。
    # 第二次会自检 daily/<today>.html 是否已存在，存在就退出，不会重复消耗 LLM。
    - cron: "0 2 * * *"      # 北京 10:00
    - cron: "30 2 * * *"     # 北京 10:30
    - cron: "0 3 * * *"      # 北京 11:00（再多一道兜底）
  workflow_dispatch:  # 允许手动触发

# 让 Pages 部署能 push & 触发
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if today already done
        id: check
        run: |
          TODAY=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          echo "今天（北京时区）: $TODAY"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "手动触发，强制执行"
            echo "skip=false" >> $GITHUB_OUTPUT
          elif [ -f "site/daily/${TODAY}.html" ] && [ -f "site/daily/${TODAY}.json" ]; then
            echo "今天的日报已存在，跳过本次（避免重复 LLM 消耗）"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "今天的日报不存在，开始生成"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/setup-python@v5
        if: steps.check.outputs.skip != 'true'
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        if: steps.check.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pipeline
        if: steps.check.outputs.skip != 'true'
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_WEBHOOK_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}
          RSSHUB_BASE_URL: ${{ secrets.RSSHUB_BASE_URL }}
          TWITTER_AUTH_TOKEN: ${{ secrets.TWITTER_AUTH_TOKEN }}
          TZ: Asia/Shanghai
        run: python -m scripts.main

      - name: Commit archive & site
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.name "ai-daily-bot"
          git config user.email "ai-daily-bot@users.noreply.github.com"
          git add archive site
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "daily: $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Upload Pages artifact
        if: steps.check.outputs.skip != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.skip != 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
